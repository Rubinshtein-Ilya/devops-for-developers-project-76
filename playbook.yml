---
- name: Prepare servers for deploy
  hosts: webservers
  become: true
  tags: setup

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - geerlingguy.pip
    - geerlingguy.docker

- name: Deploy Redmine
  hosts: webservers
  become: true
  tags: deploy

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ redmine_dir }}"
        state: directory
        mode: "0750"

    - name: Create .env file from template
      ansible.builtin.template:
        src: templates/.env.j2
        dest: "{{ redmine_dir }}/.env"
        mode: "0600"
      register: redmine_env

    - name: Run Redmine container
      community.docker.docker_container:
        name: "{{ redmine_container }}"
        image: "{{ redmine_image }}"
        env_file: "{{ redmine_dir }}/.env"
        published_ports:
          - "{{ redmine_port }}:3000"
        volumes:
          - "{{ redmine_files_volume }}:/usr/src/redmine/files"
        restart_policy: unless-stopped
        recreate: "{{ redmine_env.changed }}"
        state: started

    - name: Wait for Redmine to answer over HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ redmine_port }}/"
        status_code: 200
      register: redmine_http
      until: redmine_http.status == 200
      retries: 40
      delay: 5

- name: Set up Datadog monitoring
  hosts: webservers
  become: true
  tags: monitoring

  pre_tasks:
    - name: Ensure the Datadog API key is set
      ansible.builtin.assert:
        that:
          - datadog_api_key is defined
          - datadog_api_key | length == 32
        fail_msg: >-
          Put a real Datadog API key into vault_datadog_api_key
          (make vault-edit): it must be 32 characters long.
        quiet: true

  roles:
    - datadog.dd.agent
